# Uudelleenkäytettävä workflow, jota projektirepot kutsuvat.
# Ajaa yhden linjaston komennon (review-round tai mark-merged) PR:lle.
name: Linjasto (uudelleenkäytettävä)

on:
  workflow_call:
    inputs:
      command:
        description: "review-round tai mark-merged"
        type: string
        required: true
      pr-number:
        type: number
        required: true
      head-ref:
        description: "PR:n haara"
        type: string
        required: true
      linjasto-ref:
        description: "Tämän repon versio (haara tai tagi)"
        type: string
        default: main
      babashka-version:
        type: string
        default: "1.13.226"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      PIPELINE_TOKEN:
        description: "Fine-grained PAT: contents, pull requests, issues (read/write). Ei GITHUB_TOKEN, jotta fixerin push käynnistää CI:n."
        required: true

jobs:
  linjasto:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR:n haara
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head-ref }}
          token: ${{ secrets.PIPELINE_TOKEN }}
          fetch-depth: 0

      - name: Checkout linjasto
        uses: actions/checkout@v4
        with:
          repository: Silvast/anskun-sovelluskehityslinjasto
          ref: ${{ inputs.linjasto-ref }}
          path: .linjasto

      - name: Pidä linjasto poissa commiteista
        run: echo ".linjasto/" >> .git/info/exclude

      - name: Asenna Babashka
        run: |
          curl -sSL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/bb-install
          sudo bash /tmp/bb-install --version "${{ inputs.babashka-version }}"

      - name: Asenna Claude Code
        if: inputs.command == 'review-round'
        run: npm install -g @anthropic-ai/claude-code

      - name: Git-identiteetti
        run: |
          git config user.name "linjasto[bot]"
          git config user.email "linjasto@users.noreply.github.com"

      - name: Aja ${{ inputs.command }}
        run: bb --config .linjasto/bb.edn ${{ inputs.command }} ${{ inputs.pr-number }}
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
